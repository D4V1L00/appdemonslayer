<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemonSlayerDLE - Daily Kimetsu no Yaiba Guessing Game</title>
    <meta name="description" content="Play DemonSlayerDLE, a free unofficial fan-made guessing game inspired by Kimetsu no Yaiba. Test your knowledge of Demon Slayers, Hashira, and demons by guessing the hidden character every day.">

    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    
    <link rel="stylesheet" href="demonslayerdle.css">
    <meta name="google-site-verification" content="hGMMwyGViEe27JLrDmvLomjVThGFpa9c74lgSkRM7P0" />
</head>

<body>
    <header class="topbar">
        <div class="brand-banner">
            <div class="brand-left">
                <img class="brand-logo" src="Demon-Slayer-DLE-9-8-2026.png" alt="Logo Demon Slayer DLE">
            </div>
            <div class="brand-center">
                <span class="eyebrow">Demon Slayer</span>
                <h1>Guess the Daily Character</h1>
            </div>
            <div id="google_translate_element" aria-label="Language selector"></div>
        </div>
    </header>

    <div class="game-shell">
        <section class="panel">
            <div class="input-row">
                <input type="text" id="personaje" placeholder="Type a name..." autocomplete="off" onkeyup="sugerencia()">
                <button id="btnBuscar" type="button">Guess</button>
            </div>
            <div id="mensajeEstado" class="status-message" aria-live="polite"></div>
            <div id="sugerencias" class="sugerencias"></div>
        </section>

        <section class="table-panel">
            <table>
                <thead>
                    <tr>
                        <th>Character</th>
                        <th>Race</th>
                        <th>Gender</th>
                        <th>Combat style</th>
                        <th>First arc</th>
                    </tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
        </section>
    </div>

    <script src="demonslayerdle.js"></script>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'de,en,es,fr,it,ja,ko,pt,zh-CN',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
